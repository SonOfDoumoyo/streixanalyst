# Keeps strategy watches scanning on a host that sleeps when idle (Render free, Cloud Run ...).
# Every 5 minutes this calls the API's scan endpoint, which wakes the server and checks every active watch.
# Set two repository secrets (Settings > Secrets and variables > Actions):
#   API_URL      e.g. https://streixanalyst-api.onrender.com        (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET env var on the server
# If the secrets are missing the job does nothing, so it is safe to keep in the repo.
name: Watch ping
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scan the watches
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then echo "API_URL / CRON_SECRET not set; skipping."; exit 0; fi
          for i in 1 2 3; do
            code=$(curl -sS -o out.json -w "%{http_code}" -m 90 -X POST -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/api/watches/cron" || true)
            echo "attempt $i: HTTP $code"; cat out.json 2>/dev/null; echo
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
