# Render blueprint: API in Frankfurt (Binance/Bybit refuse US servers) + PostgreSQL.
# Free plans for testing: no persistent disk, so the model file resets when the service sleeps or redeploys.
services:
  - type: web
    name: streixanalyst-api
    runtime: docker
    rootDir: backend
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: streixanalyst-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
      - key: GURU_BRAIN_PATH
        value: /var/data/models/guru_brain.joblib
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWELVEDATA_ENABLED
        value: "0"
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MANUAL_ACCOUNTS
        sync: false
databases:
  - name: streixanalyst-db
    region: frankfurt
    plan: free
