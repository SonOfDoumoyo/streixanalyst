# Render blueprint: API in Frankfurt (Binance/Bybit refuse US servers) + PostgreSQL.
# Free plans for testing: no persistent disk, so the model file resets when the service sleeps or redeploys.
services:
  - type: web
    name: streixanalyst-api
    runtime: docker
    rootDir: backend
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: streixanalyst-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
      - key: GURU_BRAIN_PATH
        value: /var/data/models/guru_brain.joblib
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false          # Google AI Studio key; StreixAI uses Gemini, and falls back between models with keys
      - key: GEMINI_MODEL
        sync: false
      - key: TWELVEDATA_ENABLED
        sync: false          # set to 1 once you have a Twelve Data plan
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Card + bank transfer (Paystack). Webhook: <FRONTEND_URL>/api/billing/paystack/webhook
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      # Set to 1 once Paystack approves dedicated virtual accounts (automatic bank transfer).
      - key: PAYSTACK_DVA_ENABLED
        sync: false
      - key: PAYSTACK_DVA_BANK
        sync: false
      # OPay Checkout (direct OPay payment).
      - key: OPAY_MERCHANT_ID
        sync: false
      - key: OPAY_PUBLIC_KEY
        sync: false
      - key: OPAY_SECRET_KEY
        sync: false
      - key: OPAY_BASE_URL
        sync: false
      # USDT crypto payments: the wallet that receives them, network (trc20 | bep20 | erc20) and explorer API key.
      - key: CRYPTO_WALLET_ADDRESS
        sync: false
      - key: CRYPTO_NETWORK
        value: trc20
      - key: CRYPTO_EXPLORER_API_KEY
        sync: false
      # Email: confirmation links and password resets. The free plan blocks SMTP: set BREVO_API_KEY + EMAIL_FROM.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false          # e.g. StreixAnalyst <your-verified-sender@gmail.com>
      # SMTP (paid plans only on Render)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Sign in with Google / LinkedIn.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      # New accounts get this many days of full access.
      - key: TRIAL_DAYS
        value: "7"
      - key: USD_NGN_RATE
        value: "1550"
databases:
  - name: streixanalyst-db
    region: frankfurt
    plan: free
