# Render blueprint: API in Frankfurt (Binance/Bybit refuse US servers) + PostgreSQL.
services:
  - type: web
    name: streixanalyst-api
    runtime: docker
    rootDir: backend
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: streixanalyst-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
      - key: GURU_BRAIN_PATH
        value: /var/data/models/guru_brain.joblib
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWELVEDATA_ENABLED
        value: "0"
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MANUAL_ACCOUNTS
        sync: false
databases:
  - name: streixanalyst-db
    region: frankfurt
    plan: basic-256mb
